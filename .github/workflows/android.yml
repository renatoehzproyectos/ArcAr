name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK packages (NDK / CMake / build-tools)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/cmake
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platforms
          key: android-sdk-34-ndk-26.1.10909125-cmake-3.22.1

      - name: Install SDK packages
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Ensure SDK packages present
        run: |
          set -e
          # Re-install if cache was partial / missing pieces
          for pkg in "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"; do
            sdkmanager --install "$pkg" >/dev/null 2>&1 || true
          done
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "Using NDK at $ANDROID_NDK_HOME"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 3
