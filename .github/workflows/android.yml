name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: arcar-ndk-${{ runner.os }}
          max-size: 800M

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache SDK components
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
            ${{ env.ANDROID_HOME }}/cmake
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
            ${{ env.ANDROID_HOME }}/platforms/android-34
          key: sdk-34-ndk26.1-cmake3.22.1-v2

      - name: Install SDK packages
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -e
          chmod +x gradlew
          # Point CMake at ccache when available
          export PATH="/usr/lib/ccache:$PATH"
          which ccache || true
          ccache -s || true
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC" \
            -Pandroid.injected.build.abi=arm64-v8a \
            --stacktrace
          ccache -s || true
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
