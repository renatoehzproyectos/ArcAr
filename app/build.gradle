plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arcar.android'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.arcar.android"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "2.0.1-visual"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
                // Static STL avoids missing libc++_shared.so on device
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++20", "-frtti", "-fexceptions"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }
}
